spring:
  application:
    name: payment-events-consumer

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3307/payments_consumer}
    username: ${DATABASE_USER:consumer}
    password: ${DATABASE_PASSWORD:consumer}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:payment-events-consumer}
      # Read from the start so a fresh consumer group sees existing events.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # The retry-topic machinery re-publishes failed records forward to the retry
    # topics and finally to the DLT, so the consumer now also needs a producer.
    # String serializers mirror the consumer's String deserializers; Spring Boot
    # auto-configures a KafkaTemplate<String, String> from this.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

consumer:
  topic: payment-events
  dlt-topic: payment-events-dlt
  retry:
    # 3 total deliveries = 1 original + 2 retries, then the DLT. Fixed 2s backoff.
    attempts: 3
    backoff-ms: 2000

logging:
  level:
    org.flywaydb: info
