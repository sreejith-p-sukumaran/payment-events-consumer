spring:
  application:
    name: payment-events-consumer

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3307/payments_consumer}
    username: ${DATABASE_USER:consumer}
    password: ${DATABASE_PASSWORD:consumer}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:payment-events-consumer}
      # Read from the start so a fresh consumer group sees existing events.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

consumer:
  topic: payment-events

logging:
  level:
    org.flywaydb: info
